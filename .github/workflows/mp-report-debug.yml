# TEMPORARY: diagnose the Santander import (read-only).
# The repo is public, so everything fetched is encrypted to a public key whose private half
# exists only outside the repo; the log shows only status lines and ciphertext.
# Delete this branch once the data is collected.
name: MP report debug (temporary)

on:
  push:
    branches: [debug/mp-report]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect import state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install -q psycopg2-binary
          mkdir -p out
          cat > fetch.py <<'PY'
          import json, os
          def save(name, payload):
              with open(os.path.join("out", name), "w") as f:
                  f.write(payload)
          try:
              import psycopg2
              conn = psycopg2.connect(os.environ["SUPABASE_DB_URL"], connect_timeout=15)
              cur = conn.cursor()
              cur.execute("select value, updated_at from parameters where key = 'import_status'")
              save("status.json", json.dumps(cur.fetchall(), default=str))
              cur.execute("""select kind, external_id, date, amount_cents, currency_code, description, account_ref, parse_error, status, created_at,
                                    raw->>'subject'
                             from import_entries where source = 'santander' and created_at > now() - interval '8 days' order by created_at""")
              save("entries.json", json.dumps(cur.fetchall(), default=str))
              conn.close()
              print("db: ok")
          except Exception as e:
              print("db: failed", type(e).__name__)
          PY
          python3 fetch.py
          B=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'inbound-mail')].Name | [0]" --output text 2>/dev/null)
          echo "bucket found: $([ -n "$B" ] && [ "$B" != None ] && echo yes || echo no)"
          if [ -n "$B" ] && [ "$B" != None ]; then
            aws s3api list-objects-v2 --bucket "$B" --prefix santander/ --query "Contents[].{k:Key,t:LastModified,s:Size}" --output json > out/s3.json 2>out/s3.err || echo "s3 list failed"
          fi
          START=$(( ($(date +%s) - 6*86400) * 1000 ))
          aws logs filter-log-events --log-group-name /aws/lambda/piggy_import_santander --start-time "$START" --output json --query "events[].{t:timestamp,m:message}" > out/logs.json 2>out/logs.err || echo "logs failed"
          echo "files: $(ls out | wc -l)"

      - name: Encrypt and print
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAphkD77WiyQHxQLq0qy+y
          MSPTrk/lBkSzDoR5ZhGElxxS6CSCigch5QULQcAxOenaaFQRxFQmPTRi8ETvxRaR
          IGNIyzPn+6wXY1sb/p0duQA3mi4a76qpNuFrdQKbCGnH2buQVll3VxQPlqgaVkLd
          BKGiYxBT+t1af+9vi13z8OwBHx6kYn2M09tRdt0YwUb/cJinkHHrdsOgGGeiPsr+
          mZVF0KPvICPMvJsiFnvJGDAoytmVXguntrBlGjOsnTAToqwaZkNXCCA5A32wuIv5
          5CQot5U0QWmXTccIKWCfBSB2xqJd7SED7PcKQhlHgpvGlHtbsyQRPixZJvuAZbM9
          o888emnIFSS0a9CsEiPtoCI320CaXfRCX8BvxBkxn2+t1uWro22GaXgeFYApxQ0v
          4IQLV7IvHd5oeXG/v3nkBYa+w3oNWnJ115GJtlCGNSsedw1LdhyUOvC3RVpSvH1H
          +zWbx/HagztAqRdtr2k3sOh/FkPRc7vJh5NQkBi4KhAu/w1V+Swg9qfYRWokCevr
          jgeJZh//tRd47Ukueiy5vnFlU46inteu8CVp5u91pa2d8uNddIL7B8mKNaNC8/qO
          onKTnhZv9IewhEBcmV0rUG929V7/iDrjijO2fUmz3qjGM6IYVrkS/h9glCeSzOWx
          XG0BSBuMCLzFtW+aDmuvUsUCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          tar czf bundle.tgz out
          openssl rand -hex 32 > aes.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:aes.key -in bundle.tgz -out bundle.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aes.key -out aes.key.enc
          for i in $(seq 1 1500); do echo "padding-line-to-make-the-log-large-enough-to-download-as-a-file"; done
          echo "-----BEGIN MP DEBUG KEY-----"; base64 -w 76 aes.key.enc; echo "-----END MP DEBUG KEY-----"
          echo "-----BEGIN MP DEBUG DATA-----"; base64 -w 76 bundle.enc; echo "-----END MP DEBUG DATA-----"
          rm -f aes.key bundle.tgz
