# TEMPORARY: probe where Mercado Pago exposes the recipient of sent transfers.
# The repo is public, so everything fetched is encrypted to a public key whose private half
# exists only outside the repo; the log shows only status codes and ciphertext.
# Delete this branch once the data is collected.
name: MP report debug (temporary)

on:
  push:
    branches: [debug/mp-report]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch reports and transfer details
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          mkdir -p out
          cat > fetch.py <<'PY'
          import csv, io, json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          TOKEN = os.environ["MP_ACCESS_TOKEN"]
          API = "https://api.mercadopago.com"
          RR = API + "/v1/account/release_report"
          since = datetime.now(timezone.utc) - timedelta(days=10)

          def call(url):
              req = urllib.request.Request(url)
              req.add_header("Authorization", "Bearer " + TOKEN)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def save(name, payload):
              with open(os.path.join("out", name), "wb") as f:
                  f.write(payload)

          status, payload = call(RR + "/list")
          print("list:", status)
          reports = json.loads(payload or b"[]")
          reports = reports if isinstance(reports, list) else reports.get("results", [])
          ids = {}
          for r in reports:
              name = str(r.get("file_name", ""))
              if r.get("created_from") != "schedule" or not name.endswith(".csv"):
                  continue
              try:
                  created = datetime.fromisoformat(r.get("date_created", "").replace("Z", "+00:00"))
              except ValueError:
                  continue
              if created < since:
                  continue
              status, body = call(RR + "/" + urllib.parse.quote(name))
              print("download:", status, len(body), "bytes")
              if status != 200:
                  continue
              save("report_" + name, body)
              for row in csv.DictReader(io.StringIO(body.decode("utf-8-sig"))):
                  desc = (row.get("DESCRIPTION") or "").strip()
                  if desc in ("payment", "payout") and (row.get("NET_DEBIT_AMOUNT") or "0") not in ("0", "0.00", ""):
                      ids[row["SOURCE_ID"]] = desc

          print("outflow ids:", len(ids))
          for sid, desc in ids.items():
              status, body = call(API + "/v1/payments/" + sid)
              print("payments", desc, status)
              save("payment_%s_%s.json" % (desc, sid), body)
              if desc == "payout":
                  for path in ("/v1/payouts/", "/v1/transfers/", "/v1/money_transfers/"):
                      status, body = call(API + path + sid)
                      print(path.strip("/").replace("/", "_"), status)
                      save("%s_%s.json" % (path.strip("/").replace("/", "_"), sid), body)
          print("files:", len(os.listdir("out")))
          PY
          python3 fetch.py

      - name: Encrypt and print
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAv4VXrpBhTuw0IwjChXRm
          LeiJT+nW3CBADF2VDUXXzmyFZpquFE80crn8gg9r4zVhJLGcNn7tD5hJbl6OO1MO
          xR3MWe2ymVDK7RjgDRFJIfYhqQgLP6qqkErhyr5ijVwPfatVuWENds91biQOXXLm
          xzOKtpjS6B6GR1xrC0LVbDicaTl1A/zTnf+J7dzFuin6PK1YsoiaJQdUB+xjvZTh
          qjlTFODKEHHxijCe+55AsSXnrWEb1MaP5yRrk5yEqNABnFVhu8jBVK10K3tuTaoN
          t5iWgzbuUoVO8MmENhdMy3abUj2Gi/DxyjEh5UzmHjk32d/v3wggFNg+cCuSC1fq
          0hM4sxqT5XGrpa/8GjRgWy9bc9EfXYUln5EZO5MuLTH1sEep5Bw0LZ2hJ4TgBAlN
          lJPVXbbreMxXrnDhskIlNLW+gS6mH0H2NzektRTCMcnRmTh7jH6BxQQictx0Eaen
          UcHCmJwkifLftuX2nGH4M8DHFzpAu1ou7ZXIfJDz5/3lxofbszv+j12bjhLNv/MO
          O8q6Uoa7pm6NbKDD8YTZo9Plpi/bwfPT3UUihq8eBf6TrfmlFaTlZbiRS55gkE/q
          P5sugnvf6j24U02iMkAKJTNqZxAeThm1YCf8+nd1h+fYIO7zPw9ZvtnpxS6QJAaI
          6O9gV2qkFa99gKnJzi9VVcMCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          tar czf bundle.tgz out
          openssl rand -hex 32 > aes.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:aes.key -in bundle.tgz -out bundle.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aes.key -out aes.key.enc
          for i in $(seq 1 1500); do echo "padding-line-to-make-the-log-large-enough-to-download-as-a-file"; done
          echo "-----BEGIN MP DEBUG KEY-----"; base64 -w 76 aes.key.enc; echo "-----END MP DEBUG KEY-----"
          echo "-----BEGIN MP DEBUG DATA-----"; base64 -w 76 bundle.enc; echo "-----END MP DEBUG DATA-----"
          rm -f aes.key bundle.tgz
