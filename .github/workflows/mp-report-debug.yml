# TEMPORARY: diagnose a Mercado Pago import run (read-only).
# The repo is public, so everything fetched is encrypted to a public key whose private half
# exists only outside the repo; the log shows only status codes and ciphertext.
# Delete this branch once the data is collected.
name: MP report debug (temporary)

on:
  push:
    branches: [debug/mp-report]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch reports and import state
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          mkdir -p out
          cat > fetch.py <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          TOKEN = os.environ["MP_ACCESS_TOKEN"]
          RR = "https://api.mercadopago.com/v1/account/release_report"
          since = datetime.now(timezone.utc) - timedelta(days=3)

          def call(url):
              req = urllib.request.Request(url)
              req.add_header("Authorization", "Bearer " + TOKEN)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def save(name, payload):
              with open(os.path.join("out", name), "wb") as f:
                  f.write(payload if isinstance(payload, bytes) else payload.encode())

          status, payload = call(RR + "/list")
          print("list:", status)
          save("list.json", payload)
          reports = json.loads(payload or b"[]")
          reports = reports if isinstance(reports, list) else reports.get("results", [])
          for r in reports:
              name = str(r.get("file_name", ""))
              try:
                  created = datetime.fromisoformat(r.get("date_created", "").replace("Z", "+00:00"))
              except ValueError:
                  continue
              if created < since or not name.endswith(".csv"):
                  continue
              status, body = call(RR + "/" + urllib.parse.quote(name))
              print("download:", status, len(body), "bytes")
              if status == 200:
                  save("report_" + name, body)

          try:
              import psycopg2
              conn = psycopg2.connect(os.environ["SUPABASE_DB_URL"], connect_timeout=15)
              cur = conn.cursor()
              cur.execute("select key, value, updated_at from parameters where key in ('import_status','import_settings')")
              save("parameters.json", json.dumps(cur.fetchall(), default=str))
              cur.execute("""select source, kind, external_id, date, amount_cents, description, status, created_at
                             from import_entries where created_at > now() - interval '4 days' order by created_at""")
              save("entries.json", json.dumps(cur.fetchall(), default=str))
              conn.close()
              print("db: ok")
          except Exception as e:
              print("db: failed", type(e).__name__)
          print("files:", len(os.listdir("out")))
          PY
          python3 fetch.py

      - name: Encrypt and print
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsjLyHF8UQcep6ruMKK2p
          ze72JGn+GUHfJWGqoEf1oOnXnzhXNf5b3ti0haQJ4TBAeJYyqd/dXE2enOdbdn16
          JMki4H6HlYLCynZTxeERrwg3Et35ZqXIYtUSOcX3krXwt6vQpHIJTiqJ1B/Q1R2R
          pIosEzF5DBcmXgFfPKho7+ANKsaS6LjmsDyB9i084Z72n1Eiv21Hrzk94Kwgc3Zv
          f8JtIsbfJjM6qJwjLnZInkloRHh/SeuWyYbZlZzFyMJPt6b37znCLlT058eP9Bjt
          Gb4AyDtGzPfXAZtqBZ3j1JfoJLxU9QRaSUdGIB985lVVVJcc29XfddVy4rd+nuXd
          eNq0duV1BsijulkRmteHJhK3cPQz4XwOCuK5GKObtndpgwtM2UUQ16dkwHqYuROl
          Wk4aDs5v+jPMw5v6QNKKwfW6S2ZJqDMVeExl+wFhiYmzAHexFqwJxrAh0SG0DzAa
          rFpOK+jf2siSasp74QHn2UUseiM9mGDskthjaxr20vfQftRPaqcYUjYM/qlLhKHE
          s4VglcBpvx3XOY6OI5uFf98wmIhCfjjONWzDmVDn9aU7s7m+PYyfSVKqHElcEsL2
          zMr6wNaWAlJxjlx1lva3YX0Ga81R7JPieLuez0ngMbEm+RMefPb/FtFnTSRpj64v
          2/FMOaQ9IHF3uL9alKVkhkcCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          tar czf bundle.tgz out
          openssl rand -hex 32 > aes.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:aes.key -in bundle.tgz -out bundle.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aes.key -out aes.key.enc
          for i in $(seq 1 1500); do echo "padding-line-to-make-the-log-large-enough-to-download-as-a-file"; done
          echo "-----BEGIN MP DEBUG KEY-----"; base64 -w 76 aes.key.enc; echo "-----END MP DEBUG KEY-----"
          echo "-----BEGIN MP DEBUG DATA-----"; base64 -w 76 bundle.enc; echo "-----END MP DEBUG DATA-----"
          rm -f aes.key bundle.tgz
